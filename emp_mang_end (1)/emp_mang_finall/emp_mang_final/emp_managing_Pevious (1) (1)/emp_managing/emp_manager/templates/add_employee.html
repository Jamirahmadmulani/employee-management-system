<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <script>
        function validateForm() {
            
            let firstName = document.forms["empForm"]["first_name"].value.trim();
            if (firstName === "" || !/^[A-Za-z]+$/.test(firstName)) {
                alert("Please enter a valid First Name (letters only).");
                return false;
            }

            
            let lastName = document.forms["empForm"]["last_name"].value.trim();
            if (lastName === "") {
                alert("Please enter Last Name.");
                return false;
            }

            
            if (document.forms["empForm"]["gender"].value === "") {
                alert("Please select Gender.");
                return false;
            }

            
            let dob = document.forms["empForm"]["dob"].value;
            if (dob === "") {
                alert("Please select Date of Birth.");
                return false;
            }
            let today = new Date();
            let selected = new Date(dob);
            if (selected > today) {
                alert("DOB cannot be in the future.");
                return false;
            }

            
            let mob = document.forms["empForm"]["mobile_number"].value.trim();
            if (!/^[0-9]{10}$/.test(mob)) {
                alert("Please enter a valid 10-digit Mobile Number.");
                return false;
            }

            
            let altMob = document.forms["empForm"]["alternate_mobile_number"].value.trim();
            if (altMob !== "" && !/^[0-9]{10}$/.test(altMob)) {
                alert("Please enter a valid 10-digit Alternate Mobile Number.");
                return false;
            }

            
            let email = document.forms["empForm"]["email"].value.trim();
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Please enter a valid Email ID.");
                return false;
            }

            
            if (document.forms["empForm"]["marital_status"].value === "") {
                alert("Please select Marital Status.");
                return false;
            }

            
            if (document.forms["empForm"]["blood_group"].value === "") {
                alert("Please select Blood Group.");
                return false;
            }

            
            let branch = document.forms["empForm"]["branch"].value.trim();
            if (branch === "") {
                alert("Please enter Branch / Depot.");
                return false;
            }


             let firstName1 = document.forms["empForm"]["first_name1"].value.trim();
            if (firstName1 === "" || !/^[A-Za-z]+$/.test(firstName1)) {
                alert("Please enter a valid First Name (letters only).");
                return false;
            }

            
            let last_name1 = document.forms["empForm"]["last_name1"].value.trim();
            if (last_name1 === "") {
                alert("Please enter Last Name.");
                return false;
            }

            
            if (document.forms["empForm"]["gender1"].value === "") {
                alert("Please select Gender.");
                return false;
            }

            
            let dob1 = document.forms["empForm"]["dob1"].value;
            if (dob1 === "") {
                alert("Please select Date of Birth.");
                return false;
            }
            let today1 = new Date();
            let selected1 = new Date(dob);
            if (selected1 > today1) {
                alert("DOB cannot be in the future.");
                return false;
            }

            
            let mob1 = document.forms["empForm"]["mobile_number1"].value.trim();
            if (!/^[0-9]{10}$/.test(mob1)) {
                alert("Please enter a valid 10-digit Mobile Number.");
                return false;
            }

            
            let altMob1 = document.forms["empForm"]["alternate_mobile_number1"].value.trim();
            if (altMob1 !== "" && !/^[0-9]{10}$/.test(altMob1)) {
                alert("Please enter a valid 10-digit Alternate Mobile Number.");
                return false;
            }

            
            let email1 = document.forms["empForm"]["email1"].value.trim();
            let emailRegex1 = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Please enter a valid Email ID.");
                return false;
            }

            
            if (document.forms["empForm"]["marital_status1"].value === "") {
                alert("Please select Marital Status.");
                return false;
            }

            
            if (document.forms["empForm"]["blood_group1"].value === "") {
                alert("Please select Blood Group.");
                return false;
            }

            
            let branch1 = document.forms["empForm"]["branch1"].value.trim();
            if (branch1 === "") {
                alert("Please enter Branch / Depot.");
                return false;
            }
            
            


            return true;
        }
    </script>

</head>

<body class="p-4">
    <h4>Add Employee</h4>

    
    <form method="POST" class="mt-3" name="empForm" onsubmit="return validateForm()">

        
        <div class="row mb-3">
            <div class="col">
                <input class="form-control" name="first_name" placeholder="Please Enter Employee First Name">
            </div>
            <div class="col">
                <input class="form-control" name="middle_name" placeholder="Please Enter Employee Middle Name">
            </div>
            <div class="col">
                <input class="form-control" name="last_name" placeholder="Please Enter Employee Last Name">
            </div>
            <div class="col">
                <select class="form-control" name="gender">
                    <option value="">Please Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        
        <div class="row mb-3">
            <div class="col">
                <input type="date" class="form-control" name="dob" placeholder="Please Enter Date of Birth ...">
            </div>

            <div class="col input-group">
                <select class="form-select" name="country_code" style="max-width: 100px;">
                    <option value="+91" selected>+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                    <option value="+61">+61</option>
                    <option value="+81">+81</option>
                    <option value="+971">+971</option>
                </select>
                <input class="form-control" name="mobile_number" placeholder="Please Enter Mobile Number ...">
            </div>

            <div class="col input-group">
                <select class="form-select" name="alt_country_code" style="max-width: 100px;">
                    <option value="+91" selected>+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                    <option value="+61">+61</option>
                    <option value="+81">+81</option>
                    <option value="+971">+971</option>
                </select>
                <input class="form-control" name="alternate_mobile_number" placeholder="Please Enter Alternate Mobile Number ...">
            </div>

            <div class="col">
                <input class="form-control" name="email" placeholder="Please Enter Email ID ...">
            </div>
        </div>

        
        <div class="row mb-3">
            <div class="col">
                <select class="form-control" name="marital_status">
                    <option value="">Please Select Marital Status</option>
                    <option>Single</option>
                    <option>Married</option>
                </select>
            </div>
            <div class="col">
                <select class="form-control" name="blood_group">
                    <option value="">Please Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
            </div>
            <div class="col">
                <input class="form-control" name="branch" placeholder="Please Enter Branch / Depot">
            </div>
        </div>

        
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('manage_employees') }}" class="btn btn-secondary">Back to Manage Employee</a>

    </form>
</body>
</html>
