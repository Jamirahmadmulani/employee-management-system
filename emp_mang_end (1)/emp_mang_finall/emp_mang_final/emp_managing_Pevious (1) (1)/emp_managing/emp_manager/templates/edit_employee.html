<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <script>
        function validateEditForm() {
            let f = document.forms["editForm"];

            if (f["first_name"].value.trim() === "") { alert("Please enter First Name."); return false; }
            if (f["last_name"].value.trim() === "") { alert("Please enter Last Name."); return false; }
            if (f["gender"].value === "") { alert("Please select Gender."); return false; }
            if (f["dob"].value === "") { alert("Please select DOB."); return false; }
            if (!/^[0-9]{10}$/.test(f["mobile_number"].value.trim())) { alert("Enter valid 10-digit Mobile Number."); return false; }

            let alt = f["alternate_mobile_number"].value.trim();
            if (alt !== "" && !/^[0-9]{10}$/.test(alt)) { alert("Enter valid 10-digit Alternate Number."); return false; }
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(f["email"].value.trim())) { alert("Enter valid Email ID."); return false; }
            if (f["marital_status"].value === "") { alert("Please select Marital Status."); return false; }
            if (f["blood_group"].value === "") { alert("Please select Blood Group."); return false; }
            if (f["branch"].value.trim() === "") { alert("Please enter Branch."); return false; }
            if (f["other"].value.trim() === "") { alert("Please enter other."); return false; }

            return true;
        }
    </script>

</head>

<body class="p-4">
    <h4>Edit Employee</h4>

    <form method="POST" class="mt-3" name="editForm" onsubmit="return validateEditForm()">

        
        <div class="row mb-3">
            <div class="col">
                <input class="form-control" name="first_name" value="{{ emp.first_name }}" placeholder="Please Enter Employee First Name">
            </div>
            <div class="col">
                <input class="form-control" name="middle_name" value="{{ emp.middle_name }}" placeholder="Please Enter Employee Middle Name">
            </div>
            <div class="col">
                <input class="form-control" name="last_name" value="{{ emp.last_name }}" placeholder="Please Enter Employee Last Name">
            </div>
            <div class="col">
                <select class="form-control" name="gender">
                    <option value="">Please Select Gender</option>
                    <option {% if emp.gender=='Male' %}selected{% endif %}>Male</option>
                    <option {% if emp.gender=='Female' %}selected{% endif %}>Female</option>
                    <option {% if emp.gender=='Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        </div>

        
        <div class="row mb-3">
            <div class="col">
                <input type="date" class="form-control" name="dob"
                       value="{{ emp.dob if emp.dob else '' }}">
            </div>

            <div class="col input-group">
                <select class="form-select" name="country_code" style="max-width: 100px;">
                    <option value="+91">+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                    <option value="+61">+61</option>
                    <option value="+81">+81</option>
                    <option value="+971">+971</option>
                </select>
                <input class="form-control" name="mobile_number" value="{{ emp.mobile_number }}" placeholder="Please Enter Mobile Number ...">
            </div>

            <div class="col input-group">
                <select class="form-select" name="alt_country_code" style="max-width: 100px;">
                    <option value="+91">+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                    <option value="+61">+61</option>
                    <option value="+81">+81</option>
                    <option value="+971">+971</option>
                </select>
                <input class="form-control" name="alternate_mobile_number" value="{{ emp.alternate_mobile_number }}" placeholder="Please Enter Alternate Mobile Number ...">
            </div>

            <div class="col">
                <input class="form-control" name="email" value="{{ emp.email }}" placeholder="Please Enter Email ID ...">
            </div>
        </div>

       
        <div class="row mb-3">
            <div class="col">
                <select class="form-control" name="marital_status">
                    <option value="">Please Select Marital Status</option>
                    <option {% if emp.marital_status=='Single' %}selected{% endif %}>Single</option>
                    <option {% if emp.marital_status=='Married' %}selected{% endif %}>Married</option>
                </select>
            </div>
            <div class="col">
                <select class="form-control" name="blood_group">
                    <option value="">Please Select Blood Group</option>
                    <option {% if emp.blood_group=='A+' %}selected{% endif %}>A+</option>
                    <option {% if emp.blood_group=='A-' %}selected{% endif %}>A-</option>
                    <option {% if emp.blood_group=='B+' %}selected{% endif %}>B+</option>
                    <option {% if emp.blood_group=='B-' %}selected{% endif %}>B-</option>
                    <option {% if emp.blood_group=='O+' %}selected{% endif %}>O+</option>
                    <option {% if emp.blood_group=='O-' %}selected{% endif %}>O-</option>
                    <option {% if emp.blood_group=='AB+' %}selected{% endif %}>AB+</option>
                    <option {% if emp.blood_group=='AB-' %}selected{% endif %}>AB-</option>
                </select>
            </div>
            <div class="col">
                <input class="form-control" name="branch" value="{{ emp.branch }}" placeholder="Please Enter Branch / Depot">
            </div>
        </div>

      
        <button class="btn btn-success">Update</button>
        <a href="{{ url_for('manage_employees') }}" class="btn btn-secondary">Cancel</a>

    </form>
</body>
</html>
