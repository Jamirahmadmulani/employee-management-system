<!DOCTYPE html>
<html>
<head>
    <title>View Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <h4>View Employee</h4>
    <form class="mt-3">
        <div class="row mb-3">
            <div class="col"><input class="form-control" value="{{ emp.first_name }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.middle_name }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.last_name }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.gender }}" readonly></div>
        </div>
        <div class="row mb-3">
            <div class="col"><input class="form-control" value="{{ emp.dob }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.mobile_number }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.alternate_mobile_number }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.email }}" readonly></div>
        </div>
        <div class="row mb-3">
            <div class="col"><input class="form-control" value="{{ emp.marital_status }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.blood_group }}" readonly></div>
            <div class="col"><input class="form-control" value="{{ emp.branch }}" readonly></div>
        </div>
        <a href="{{ url_for('manage_employees') }}" class="btn btn-secondary">Back to Manage Employee</a>
    </form>
</body>
</html>
